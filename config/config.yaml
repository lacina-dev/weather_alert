general:
  # Select location from list below (override locally via config.local.yaml)
  default_location: "Custom"
  # Use map as background 0: no map, 1: osm, 2: google satellite
  use_map: 1
  # Radar data source: "rainviewer", "chmi" or "mosaic"
  # rainviewer – global coverage, no API key required, free tier has no nowcast, max zoom 7
  # chmi       – Czech Republic + neighbours, real radar + 60-min nowcast, completely free
  # mosaic     – multi-source mosaic (ČHMÚ, OPERA, RainViewer, …) from the local
  #              precip-mosaic service (package vitulus_precip), see "mosaic:" below
  source: "chmi"

radar:
  # Distance in kilometers. Inner radius of the square frame.
  frame_rain: 1
  frame_alert: 9
  frame_warning: 20
  # Miniumum percent of rain in frame. Value bellow will be ignored as a noise.
  min_rain: 5.0
  min_alert: 10.0
  min_warning: 30.0
  snow: 0
  smooth: 1
  # Possible values 256 or 512 in px
  size: 512
  zoom: 8  # RainViewer: API max allowed zoom is 7; code subtracts 1 for size 512
  # Rain threshold:
  #   RainViewer: 215 removes light grey (sub-rain echo)
  #   ČHMÚ:       IGNORED – every ČHMÚ palette colour except the two
  #               "no rain" shades (black=no echo, grey=below noise) is
  #               counted as rain, so ALL rain is shown automatically.
  rain_threshold: 100
  # Color scheme values 0-8 (RainViewer only). See https://www.rainviewer.com/api/color-schemes.html
  color: 1

# precip-mosaic service, used only with general.source: "mosaic".
# The service must run (vitulus_precip, `vitulus-precip serve`) with an area that
# contains the location. Frames are evaluated with the radar: frames above.
mosaic:
  url: "http://localhost:8097"
  timeout_s: 10        # per HTTP request
  poll_s: 60           # how often the service is asked for a new frame [s] (asked from poll_s - 5 s on: the loop also runs every 60 s)
  rain_mmh: 0.1        # pixel at or above this rate [mm/h] counts as rain (0.1 ≈ 7 dBZ)
  half_km: 0           # half side of the radar picture [km]; 0 = 1.6 × frame_warning
  nowcast_max_min: 60  # nowcast frames further ahead are not fetched [min]
  min_covered: 0.5     # share of the frame_rain square that must have radar data;
                       # less = status UNAVAILABLE (NOW frame: no RainAlert published)


